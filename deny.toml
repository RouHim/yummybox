[advisories]
db-path = "~/.cargo/advisory-dbs"
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # libsqlite3-sys 0.37 is pinned by sqlx 0.9, so the fix (0.39+) is not
    # reachable from here. The advisory requires an attacker able to write the
    # database's -wal file; the data directory belongs to the app user in a
    # single-user local deployment, so the exposure does not apply.
    "RUSTSEC-2026-0459",
    # chrono is soft-deprecated upstream (no patch will ever exist). Leaving it
    # means migrating model.rs/plan.rs/db.rs timestamps to `time` and switching
    # sqlx's `chrono` feature to `time`; sqlx 0.9 has no jiff feature, and jiff
    # 1.0 only shipped on 2026-11-24. The advisory is informational — chrono
    # has no open soundness/vulnerability reports — so this is a planned
    # migration, not an accepted risk. Remove this entry once it lands.
    { id = "RUSTSEC-2026-0543", reason = "chrono migration to `time` pending, see comment above" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0",
    "CC0-1.0", "CDLA-Permissive-2.0"
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []


[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
