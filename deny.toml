[advisories]
db-path = "~/.cargo/advisory-dbs"
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0",
    "CC0-1.0", "CDLA-Permissive-2.0"
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    { name = "windows-sys", version = "0.52", reason = "transitive via ring; Windows-only crate unreachable on pinned Linux target" },
]


[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
